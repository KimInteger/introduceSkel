      height: 400px;
      border: 2px double black;
    }
  </style>

<body>
  <h1>Team-1의 멤버를 소개합니다! 뚝딱이들!</h1>
  <div id="root">
    <div id="leader">구하림</div>
    <div id="pinokio">정호연</div>
    <div id="yoshi">송이현</div>
    <div id="waruru">김정수</div>
    <div id="likeBlack">이연승</div>
    <script src="./script.js"></script>

</html>
